<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hyderabad School Explorer</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 0 auto;
        padding: 20px;
        color: #222;
        background: #fafafa;
    }

    h1 {
        margin-bottom: 5px;
    }

    .subtitle {
        color: #666;
        margin-top: 0;
    }

    #search {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        font-size: 16px;
        border: 1px solid #bbb;
        border-radius: 5px;
        margin: 20px 0 10px;
    }

    #status {
        color: #666;
        margin: 10px 0 20px;
    }

    /* Map showing the currently visible (filtered) schools as dots */
    #map {
        width: 100%;
        height: 320px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 20px;
    }

    .leaflet-popup-content {
        font-size: 13px;
    }

    /* Responsive card grid: as many columns as fit at >=240px each,
       collapsing to a single column on narrow screens automatically. */
    #schools {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 14px;
    }

    .school {
        background: white;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 15px;
        display: flex;
        flex-direction: column;
    }

    .school h2 {
        font-size: 17px;
        margin: 0 0 8px;
    }

    .field {
        font-size: 14px;
        margin-bottom: 6px;
    }

    .field .label {
        color: #888;
        margin-right: 4px;
    }

    .curriculum-row {
        margin-bottom: 8px;
    }

    .curriculum {
        display: inline-block;
        background: #eee;
        padding: 4px 8px;
        margin-right: 5px;
        margin-bottom: 5px;
        border-radius: 3px;
        font-size: 12px;
    }

    .field a {
        text-decoration: none;
    }

    .last-verified {
        margin-top: auto;
        padding-top: 8px;
        font-size: 12px;
        color: #888;
    }

    .footer {
        margin-top: 30px;
        padding-top: 15px;
        border-top: 1px solid #ddd;
        font-size: 14px;
        color: #666;
    }

    button {
        padding: 8px 12px;
        cursor: pointer;
    }

    @media (max-width: 600px) {
        body {
            padding: 12px;
        }

        #map {
            height: 240px;
        }
    }
</style>
</head>

<body>

<h1>Hyderabad School Explorer</h1>

<p class="subtitle">
    Explore CBSE and international schools in Hyderabad.
</p>

<input
    type="search"
    id="search"
    placeholder="Search school, campus or curriculum..."
    autocomplete="off"
>

<div id="status">Loading schools...</div>

<div id="map"></div>

<div id="schools"></div>

<div class="footer">
    <a href="data/schools.csv">Download dataset</a>
    &nbsp; | &nbsp;
    <a id="issueLink" href="#" target="_blank">
        Report a correction or missing school
    </a>
</div>

<script>

const CSV_FILE = "data/schools.csv";

/*
 * GitHub repository URL.
 *
 * Change this to your repository once you create it.
 *
 * Example:
 * https://github.com/yourusername/hyderabad-school-explorer/issues/new
 */
const GITHUB_ISSUE_URL =
    "https://github.com/YOUR-USERNAME/hyderabad-school-explorer/issues/new";


let schools = [];


/*
 * Map setup (Leaflet + OpenStreetMap tiles - both open source, no API
 * key needed). One layer group holds all dots for the CURRENTLY VISIBLE
 * (i.e. search-filtered) list of schools, so it always mirrors the grid
 * below it.
 */
const map = L.map("map").setView([17.42, 78.45], 11); // roughly centred on Hyderabad

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: "&copy; OpenStreetMap contributors",
    maxZoom: 18
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);


/*
 * Simple CSV parser.
 *
 * Handles quoted fields containing commas, e.g.
 *
 * "Delhi Public School, Nacharam","Nacharam","CBSE",...
 */
function parseCSV(text) {

    const rows = [];
    let row = [];
    let value = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {

        const char = text[i];
        const next = text[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
            value += '"';
            i++;
        }

        else if (char === '"') {
            insideQuotes = !insideQuotes;
        }

        else if (char === "," && !insideQuotes) {
            row.push(value);
            value = "";
        }

        else if ((char === "\n" || char === "\r") && !insideQuotes) {

            if (char === "\r" && next === "\n") {
                i++;
            }

            row.push(value);
            value = "";

            if (row.some(cell => cell.trim() !== "")) {
                rows.push(row);
            }

            row = [];
        }

        else {
            value += char;
        }
    }

    // Handle final row
    if (value !== "" || row.length > 0) {
        row.push(value);

        if (row.some(cell => cell.trim() !== "")) {
            rows.push(row);
        }
    }

    if (rows.length === 0) {
        return [];
    }

    const headers = rows[0].map(h => h.trim());

    return rows.slice(1).map(row => {

        const record = {};

        headers.forEach((header, index) => {
            record[header] = (row[index] || "").trim();
        });

        return record;
    });
}


/*
 * Load CSV
 */
async function loadSchools() {

    try {

        const response = await fetch(CSV_FILE);

        if (!response.ok) {
            throw new Error(
                "Unable to load " + CSV_FILE +
                " (" + response.status + ")"
            );
        }

        const text = await response.text();

        schools = parseCSV(text);

        document.getElementById("status").textContent =
            schools.length + " school campuses";

        displaySchools(schools);

    }

    catch (error) {

        document.getElementById("status").innerHTML =
            "<strong>Unable to load the school data.</strong><br>" +
            error.message +
            "<br><br>" +
            "If you are opening index.html directly using file://, " +
            "run a local web server such as " +
            "<code>python -m http.server 8000</code>.";

        console.error(error);
    }
}


/*
 * Display schools - renders both the card grid AND the map dots for
 * whatever list is passed in (the full set, or a search-filtered subset).
 */
function displaySchools(list) {

    const container = document.getElementById("schools");

    container.innerHTML = "";

    updateMapMarkers(list);

    document.getElementById("status").textContent =
        list.length +
        (list.length === 1 ? " school campus" : " school campuses");

    if (list.length === 0) {

        container.innerHTML =
            "<p>No schools found.</p>";

        return;
    }

    list.forEach(school => {

        const card = document.createElement("div");

        card.className = "school";

        const title = document.createElement("h2");

        title.textContent =
            school.School || "Unnamed school";

        card.appendChild(title);


        if (school.Campus) {

            const campus = document.createElement("div");

            campus.className = "field";

            campus.innerHTML = '<span class="label">Campus:</span>';

            if (school.Website) {

                const campusLink = document.createElement("a");

                campusLink.href = school.Website;
                campusLink.target = "_blank";
                campusLink.rel = "noopener";
                campusLink.textContent = school.Campus;

                campus.appendChild(campusLink);

            } else {

                campus.appendChild(
                    document.createTextNode(school.Campus)
                );
            }

            card.appendChild(campus);
        }


        /*
         * Curriculum
         *
         * Expected format:
         *
         * CBSE;IB;Cambridge
         */
        if (school.Curriculum) {

            const curriculumContainer =
                document.createElement("div");

            curriculumContainer.className = "curriculum-row";

            school.Curriculum
                .split(";")
                .map(item => item.trim())
                .filter(Boolean)
                .forEach(item => {

                    const tag =
                        document.createElement("span");

                    tag.className = "curriculum";

                    tag.textContent = item;

                    curriculumContainer.appendChild(tag);
                });

            card.appendChild(curriculumContainer);
        }


        if (school["Last verified"]) {

            const verified =
                document.createElement("div");

            verified.className = "last-verified";

            verified.textContent =
                "Last verified: " +
                school["Last verified"];

            card.appendChild(verified);
        }


        container.appendChild(card);
    });
}


/*
 * Sync the map's dots to whatever list is currently on screen. Schools
 * without usable coordinates are simply skipped rather than guessed at.
 */
function updateMapMarkers(list) {

    markersLayer.clearLayers();

    list.forEach(school => {

        const lat = parseFloat(school.Latitude);
        const lon = parseFloat(school.Longitude);

        if (isNaN(lat) || isNaN(lon)) {
            return;
        }

        const marker = L.circleMarker([lat, lon], {
            radius: 6,
            weight: 1,
            color: "#fff",
            fillColor: "#3a7ca5",
            fillOpacity: 0.85
        });

        marker.bindPopup(
            "<strong>" + (school.School || "Unnamed school") + "</strong>" +
            (school.Campus ? "<br>" + school.Campus : "")
        );

        marker.addTo(markersLayer);
    });
}


/*
 * Search
 */
document
    .getElementById("search")
    .addEventListener("input", function () {

        const query =
            this.value.trim().toLowerCase();

        if (!query) {

            displaySchools(schools);

            return;
        }


        const filtered =
            schools.filter(school => {

                return (

                    (school.School || "")
                        .toLowerCase()
                        .includes(query)

                    ||

                    (school.Campus || "")
                        .toLowerCase()
                        .includes(query)

                    ||

                    (school.Curriculum || "")
                        .toLowerCase()
                        .includes(query)

                );

            });


        displaySchools(filtered);
    });


/*
 * GitHub issue link
 */
document.getElementById("issueLink").href =
    GITHUB_ISSUE_URL +
    "?title=School%20data%20correction";


/*
 * Start application
 */
loadSchools();

</script>

</body>
</html>
